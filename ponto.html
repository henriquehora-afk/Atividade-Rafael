<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ponto e Jornada</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .camera {
            background: #222;
            color: white;
            padding: 50px 0;
            margin: 10px 0;
            border-radius: 5px;
        }

        #resultado {
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2> Ponto e Jornada</h2>

        <p>Fiscal: Henrique</p>

        <input id="nome" placeholder="Nome do trabalhador">

        <div class="camera">
            <br>
            Reconhecimento Facial
        </div>

        <button onclick="registrar()">
            Registrar Ponto
        </button>

        <p id="resultado"></p>

    </div>


    <script>

        function registrar() {

            let nome = document.getElementById("nome").value;

            if (nome == "") {

                document.getElementById("resultado").innerHTML =
                    "Digite o nome do trabalhador.";

                return;
            }

            let horario = new Date().toLocaleTimeString();


            localStorage.setItem(
                "ultimoPonto",
                nome + " - " + horario
            );


            if (navigator.onLine) {

                document.getElementById("resultado").innerHTML =
                    "🟢 Ponto registrado e enviado!<br>" +
                    nome + "<br>" +
                    horario;

            } else {

                document.getElementById("resultado").innerHTML =
                    "🟠 Ponto armazenado offline!<br>" +
                    "Aguardando conexão para sincronizar.<br>" +
                    nome + " - " +
                    horario;

            }

        }

    </script>

</body>

</html>
